<html lang="zh-CN">
<head>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#f4f5f6;color:#1d2327;font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.top{flex:0 0 44px;height:44px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #dcdfe2}
.brand{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.brand .mark{font-size:9.5px;letter-spacing:.12em;color:#9aa0a5;border:1px solid #cfd4d8;line-height:1;padding:2px 4px;font-weight:600;flex:0 0 auto}

.crumbs{display:flex;align-items:center;gap:3px;min-width:0;max-width:46vw;font-size:11.5px;color:#767c81;white-space:nowrap}

.crumbs button:hover{color:#1d2327}
.crumbs .cur{color:#20262a;font-weight:500;max-width:190px;overflow:hidden;text-overflow:ellipsis}

.switch button:hover{color:#2a3034}
.switch button.on{color:#1b2125;border-color:#1b2125}
.metrics{flex:0 0 23px;height:23px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:10.5px;color:#92979c;letter-spacing:.02em;white-space:nowrap;overflow:hidden}

main{flex:1;min-height:0;position:relative}
.map{position:absolute;inset:6px 9px 9px 9px;overflow:hidden;background:#f4f5f6}
.tip{position:fixed;left:0;top:0;z-index:99;pointer-events:none;display:none;background:#fff;border:1px solid #c9ced2;color:#282e32;font-size:11px;line-height:1.45;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
.tile{position:absolute;overflow:hidden;background-color:#ddd;contain:layout paint}
.tile .hd{position:absolute;left:0;top:0;right:0;display:flex;align-items:center;gap:4px;padding:0 5px;overflow:hidden;white-space:nowrap;font-weight:600;letter-spacing:.01em;cursor:pointer}
.tile .hd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.tile .hd .gl{flex:0 0 auto;opacity:.5;font-size:10px;font-weight:400}
.map > .hd{position:absolute;z-index:2;display:flex;align-items:center;gap:4px;padding:0 4px;overflow:hidden;white-space:nowrap;font-weight:600;cursor:pointer;letter-spacing:.01em}
.lab{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;overflow:hidden;line-height:1.16}
.lab .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lab .v{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.7;font-variant-numeric:tabular-nums;margin-top:1px}
.tile.dk{color:rgba(255,255,255,.95)}
.tile.lt{color:#1f2529}
.tile.null{background:#e9eaeb;background-image:repeating-linear-gradient(135deg,rgba(35,45,50,.055) 0 3px,rgba(35,45,50,0) 3px 7px)}
.tile.hov{outline:1.5px solid rgba(24,32,37,.55);outline-offset:-2px}

.tile.can{cursor:zoom-in}

.plus{position:absolute;right:3px;top:1px;font-size:11px;line-height:1;opacity:.55;pointer-events:none}
.err{padding:24px;font-size:13px;line-height:1.7;color:#7d4b44}
/* B */
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;touch-action:none}
.tile-svg{stroke:#fff;stroke-width:1;transition:stroke 120ms,stroke-width 120ms}
.tile-svg.hov{stroke:#232a2f;stroke-width:2}
.blabels{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:1}

.bl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:nowrap;line-height:1.16;font-variant-numeric:tabular-nums}
.bl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bl.dk{color:rgba(255,255,255,.95)}
.bl.lt{color:rgba(30,36,40,.92)}

.blabels{transition:opacity 130ms linear}
@media (max-width:719px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:32px 24px;height:58px;flex-basis:58px;gap:0 10px;padding:0 10px}
  .brand{grid-column:1;grid-row:1}.brand .t{font-size:13px}.brand .mark{font-size:9px}
  .switch{grid-column:2;grid-row:1;font-size:11.5px;gap:11px}
  .crumbs{grid-column:1 / 3;grid-row:2;max-width:100%;font-size:10.5px}
  .metrics{flex-basis:21px;height:21px;font-size:10px;padding:0 11px}
  .metrics .r{display:none}
  .map{inset:4px 6px 6px 6px}
}

<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark">14E</span><span class="t">中国 14 亿人 · 职业分布</span></div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="switch">
    <button data-s="scheme-a">年龄</button>
    <button data-s="scheme-b" class="on">职业</button>
  </div>
</header>
<div class="metrics"><span>98 个类别 · 数据 2022 年 · 2 套分类法</span><span class="r"></span></div>
<main>
  <div class="map" id="map"></div>
</main>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';

/* 14亿人职业分布 · 三个 demo 共用的数据与绘制工具（无第三方依赖） */

const PAL = [
  { h: 176, s: 26 }, // 青
  { h: 207, s: 29 }, // 蓝
  { h: 33,  s: 30 }, // 赭
  { h: 80,  s: 24 }, // 橄榄
  { h: 266, s: 22 }, // 紫
  { h: 9,   s: 28 }, // 砖红
  { h: 205, s: 7  }  // 灰蓝
];

const ROOT_SHORT = { 'scheme-a': '全国 14 亿人', 'scheme-b': '成年在业 8 亿' };

const $ = (s, r = document) => r.querySelector(s);

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function fmtWan(v) {
  if (v == null || !isFinite(v)) return '无数据';
  if (v >= 10000) return (v / 10000).toFixed(2) + ' 亿';
  if (v >= 1000) return Math.round(v).toLocaleString('zh-CN') + ' 万';
  return (Math.round(v * 10) / 10).toString() + ' 万';
}

function pctOf(v, p) {
  if (v == null || !p) return '';
  return (v / p * 100).toFixed(1) + '%';
}

function uiScale() { return window.innerWidth < 720 ? 0.86 : 1; }

function disp(n) {
  return (n._short || n.name || '').trim();
}

function tone(node) {
  const p = PAL[(node._g < 0 ? 0 : node._g) % PAL.length];
  const d = clamp(node._d, 1, 4);
  const base = [0, 36, 62, 73, 81][d];
  const wob = [0, 0, 2.2, 1.7, 1.1][d];
  const sat = Math.max(9, p.s - (d - 1) * 3);
  return { h: p.h, s: sat, l: clamp(base + (((node._i || 0) * 7) % 5 - 2) * wob, 18, 90) };
}

function toneCss(t) { return `hsl(${t.h} ${t.s}% ${t.l}%)`; }
function isDark(t) { return t.l < 56; }
function textInk(t) { return isDark(t) ? 'rgba(255,255,255,.95)' : 'rgba(30,36,40,.92)'; }

function labelFont(w, h) {
  if (w < 26 || h < 13) return 0;
  const a = w * h;
  const base = a >= 20000 ? 16 : a >= 6800 ? 13 : a >= 2200 ? 11 : a >= 820 ? 9.5 : 0;
  return base ? base * uiScale() : 0;
}
function valueFont(fs) { return Math.max(7.5, fs * 0.72); }

/* 方形化 treemap（等价于 d3.treemapSquarify.ratio(1) 的常用实现） */
function squarify(items, rect) {
  const out = [];
  const wt = d => (d.w != null ? d.w : (d._w || 0));
  const total = items.reduce((s, d) => s + wt(d), 0);
  if (!(total > 0) || rect.w <= 0 || rect.h <= 0) return out;
  const scale = (rect.w * rect.h) / total;
  const list = items.map((d, idx) => ({ d, idx, a: Math.max(wt(d) * scale, 1e-9) }))
    .sort((x, y) => y.a - x.a);
  let x = rect.x, y = rect.y, w = rect.w, h = rect.h;
  let row = [], rowSum = 0, i = 0;
  const side = () => Math.min(w, h);
  const worst = (sum, max, min, s) => Math.max((s * s * max) / (sum * sum), (sum * sum) / (s * s * min));
  function flush() {
    if (!row.length) return;
    if (w >= h) {
      const cw = rowSum / h;
      let cy = y;
      for (const it of row) { const ih = it.a / cw; out.push({ d: it.d, i: it.idx, x, y: cy, w: cw, h: ih }); cy += ih; }
      x += cw; w -= cw;
    } else {
      const rh = rowSum / w;
      let cx = x;
      for (const it of row) { const iw = it.a / rh; out.push({ d: it.d, i: it.idx, x: cx, y, w: iw, h: rh }); cx += iw; }
      y += rh; h -= rh;
    }
    row = []; rowSum = 0;
  }
  while (i < list.length) {
    const it = list[i];
    if (!row.length) { row.push(it); rowSum = it.a; i++; continue; }
    const mx = Math.max(...row.map(r => r.a), it.a);
    const mn = Math.min(...row.map(r => r.a), it.a);
    const withIt = worst(rowSum + it.a, mx, mn, side());
    const omx = Math.max(...row.map(r => r.a));
    const omn = Math.min(...row.map(r => r.a));
    const old = worst(rowSum, omx, omn, side());
    if (withIt <= old) { row.push(it); rowSum += it.a; i++; }
    else flush();
    if (w <= 0.001 || h <= 0.001) break;
  }
  flush();
  out.sort((a, b) => a.i - b.i);
  return out;
}

function inset(r, d) {
  return { x: r.x + d, y: r.y + d, w: Math.max(0, r.w - 2 * d), h: Math.max(0, r.h - 2 * d) };
}

/* 树预处理：权重、父指针、组色相、null 占位、短名 */
function prep(root) {
  if (root._prepped) return;
  const nodes = [];
  (function walk(n, p, d, g, i) {
    n._p = p; n._d = d; n._g = g; n._i = i;
    n._kids = n.children || [];
    n._short = String(n.name || '').replace(/（[^）]*）/g, '').trim() || n.name;
    n._kids.forEach((c, j) => walk(c, n, d + 1, g, j));
    nodes.push(n);
  })(root, null, 0, -1, 0);

  function setg(n, g) { n._g = g; n._kids.forEach(c => setg(c, g)); }
  root._kids.forEach((c, i) => setg(c, i));

  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (n.value != null) n._w = n.value;
    else if (n._kids.length) n._w = n._kids.reduce((s, c) => s + (c._w || 0), 0) || null;
    else n._w = null;
  }

  // value=null 的叶子：用父级数值等分占位，只用于面积，不伪造数值
  for (const n of nodes) {
    if (n._w == null && !n._kids.length) {
      const p = n._p;
      const nulls = (p ? p._kids : []).filter(c => c._w == null && !c._kids.length);
      const base = p && p.value != null ? p.value : (p && p._w) || 1;
      n._w = p && p.value != null ? base / Math.max(1, nulls.length) : Math.max(1, base * 0.02);
      n._ph = true;
    }
  }
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (n.value == null && n._kids.length) {
      n._w = n._kids.reduce((s, c) => s + (c._w || 0), 0) || n._w;
    }
  }

  nodes.forEach(n => {
    const path = [];
    let q = n;
    while (q) { path.unshift(q); q = q._p; }
    n._path = path;
  });

  root._all = nodes;
  root._byId = {};
  nodes.forEach(n => { root._byId[n.id] = n; });
  root._prepped = true;
}

function tipHtml(n) {
  const share = n._ph ? '' : pctOf(n.value, n._p ? n._p._w : null);
  let s = `<b>${esc(disp(n))}</b>`;
  s += ` · ${fmtWan(n._ph ? null : n.value)}`;
  if (share) s += ` · ${share}`;
  if (n.value == null && n._kids.length && n._w) s += ` · 子项合计 ${fmtWan(n._w)}`;
  return s;
}

const tipEl = document.getElementById('tip');
function placeTip(x, y) {
  const pad = 10;
  const r = tipEl.getBoundingClientRect();
  let left = x + 12, top = y + 14;
  if (left + r.width > window.innerWidth - pad) left = x - r.width - 10;
  if (top + r.height > window.innerHeight - pad) top = y - r.height - 10;
  tipEl.style.left = Math.max(4, left) + 'px';
  tipEl.style.top = Math.max(4, top) + 'px';
}
function showTip(n, x, y) {
  tipEl.innerHTML = tipHtml(n);
  tipEl.style.display = 'block';
  placeTip(x, y);
}
function hideTip() { tipEl.style.display = 'none'; }

function setMetrics(scheme) {
  const right = document.querySelector('.metrics .r');
  if (right) {
    const leaves = scheme.root._all.filter(n => !n._kids.length).length;
    right.textContent = `${scheme.id === 'scheme-a' ? '年龄轴' : '职业轴'} · ${leaves} 叶`;
  }
}

function buildCrumbs(container, scheme, focus, onPick) {
  const path = focus && focus._path ? focus._path : [scheme.root];
  const parts = [];
  path.forEach((n, i) => {
    const label = i === 0 ? (ROOT_SHORT[scheme.id] || disp(n)) : disp(n);
    if (i < path.length - 1) {
      parts.push(`<button data-id="${esc(n.id)}">${esc(label)}</button><span class="sep">›</span>`);
    } else {
      parts.push(`<span class="cur">${esc(label)}</span>`);
    }
  });
  container.innerHTML = parts.join('');
  container.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => onPick(b.dataset.id));
  });
}

function markSwitch(schemeId) {
  document.querySelectorAll('.switch button').forEach(b => {
    b.classList.toggle('on', b.dataset.s === schemeId);
  });
}

async function loadTaxonomy() {
  const res = await fetch('./data/taxonomy.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}


'use strict';

/* B · finviz + 连续缩放：几何只算一次，相机 transform 缩放 */

const B = { data: null, scheme: null, focus: null, byId: null };
const bMap = document.getElementById('map');
const bCrumbs = document.getElementById('crumbs');
const cam = { k: 1, x: 0, y: 0 };
let bBuilt = null;       // { svg, layer, rects:[], labels:[] }
let bAnim = null;
let bHover = null;
let bDragging = false;
let bDown = null;
let bMoved = 0;
let bLabelRaf = 0;
let bWheelTimer = 0;

function bW() { return bMap.clientWidth; }
function bH() { return bMap.clientHeight; }

function applyCam() {
  if (!bBuilt) return;
  bBuilt.g.setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.k})`);
  bBuilt.rects.forEach(r => {
    // 视口外的方块直接不渲染，缩放时也省事
    const nr = r._node._rect;
    const sx = nr.x * cam.k + cam.x, sy = nr.y * cam.k + cam.y;
    const sw = nr.w * cam.k, sh = nr.h * cam.k;
    const vis = sw > -2 && sh > -2 && sx < bW() + 2 && sy < bH() + 2 && sx + sw > -2 && sy + sh > -2;
    r.el.style.display = vis ? '' : 'none';
  });
}

function bLabel() {
  if (!bBuilt) return;
  const W = bW(), H = bH(), k = cam.k;
  const layer = bBuilt.layer;
  const frag = document.createDocumentFragment();
  const caps = [];

  for (const it of bBuilt.labels) {
    const n = it.n, r = it.r;
    const sx = r.x * k + cam.x, sy = r.y * k + cam.y;
    const sw = r.w * k, sh = r.h * k;
    if (sx > W + 2 || sy > H + 2 || sx + sw < -2 || sy + sh < -2) continue;
    if (it.cap) {
      if (sw < 48 || sh < 24) continue;
      const c = document.createElement('div');
      c.className = 'gcap';
      const t = tone(n);
      c.style.cssText = `left:${Math.max(0, sx + 3)}px;top:${Math.max(0, sy + 3)}px;max-width:${Math.max(34, Math.min(150, sw - 8))}px;background:hsl(${t.h} ${Math.max(10, t.s + 4)}% 34%)`;
      c.textContent = disp(n);
      caps.push(c);
      continue;
    }
    const fs = labelFont(sw - 4, sh - 4);
    if (!fs) continue;
    const t = tone(n);
    const d = document.createElement('div');
    d.className = 'bl' + (isDark(t) ? ' dk' : ' lt');
    d.style.cssText = `left:${sx}px;top:${sy}px;width:${sw}px;height:${sh}px;font-size:${fs}px`;
    const showV = fs >= 10 && sh >= 30 && sw >= 52;
    const vt = n._ph ? '无数据' : fmtWan(n.value);
    d.innerHTML = `<span class="n">${esc(disp(n))}</span>` +
      (showV ? `<span class="v" style="font-size:${valueFont(fs)}px">${vt}</span>` : '');
    frag.appendChild(d);
  }
  layer.innerHTML = '';
  layer.appendChild(frag);
  caps.forEach(c => layer.appendChild(c));
  layer.classList.remove('fade');
}

function bScheduleLabel() {
  if (bLabelRaf) return;
  bLabelRaf = requestAnimationFrame(() => {
    bLabelRaf = 0;
    bLabel();
  });
}

function bFit(node) {
  const W = bW(), H = bH();
  if (!node || node === B.scheme.root) return { k: 1, x: 0, y: 0 };
  const r = node._rect;
  if (!r || r.w < 1 || r.h < 1) return { k: 1, x: 0, y: 0 };
  const m = 3;
  const k = clamp(Math.min((W - 2 * m) / r.w, (H - 2 * m) / r.h), 1, 80);
  return { k, x: (W - r.w * k) / 2 - r.x * k, y: (H - r.h * k) / 2 - r.y * k };
}

function bStopAnim() {
  if (bAnim) { cancelAnimationFrame(bAnim); bAnim = null; }
}

function bGo(node, instant) {
  bStopAnim();
  const target = bFit(node);
  if (instant) {
    cam.k = target.k; cam.x = target.x; cam.y = target.y;
    B.focus = node;
    applyCam(); bLabel();
    bCrumb();
    return;
  }
  const from = { k: cam.k, x: cam.x, y: cam.y };
  const t0 = performance.now(), dur = 400;
  bBuilt.layer.classList.add('fade');
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    cam.k = from.k + (target.k - from.k) * e;
    cam.x = from.x + (target.x - from.x) * e;
    cam.y = from.y + (target.y - from.y) * e;
    applyCam();
    if (p < 1) { bAnim = requestAnimationFrame(step); }
    else {
      bAnim = null;
      B.focus = node;
      bLabel();
      bCrumb();
    }
  }
  bAnim = requestAnimationFrame(step);
}

function bCrumb() {
  buildCrumbs(bCrumbs, B.scheme, B.focus, id => {
    bGo(B.byId[id] || B.scheme.root);
  });
}

function bZoomAt(mx, my, factor) {
  const k2 = clamp(cam.k * factor, 1, 80);
  if (Math.abs(k2 - cam.k) < 1e-5) return;
  const wx = (mx - cam.x) / cam.k, wy = (my - cam.y) / cam.k;
  cam.k = k2;
  cam.x = mx - wx * k2;
  cam.y = my - wy * k2;
  const W = bW(), H = bH();
  cam.x = clamp(cam.x, W - W * cam.k, 0);
  cam.y = clamp(cam.y, H - H * cam.k, 0);
  applyCam();
  bScheduleLabel();
}

function bHoverish(n) {
  if (!bBuilt) return;
  if (bHover && bHover.dataset.id !== n.id) {
    bHover.classList.remove('hov');
  }
  bHover = bBuilt.rects.find(r => r._node === n) ? bBuilt.rects.find(r => r._node === n).el : null;
  if (bHover) bHover.classList.add('hov');
}

function bBuild() {
  bStopAnim();
  const W = bW(), H = bH();
  const old = bMap.querySelector('svg');
  if (old) old.remove();
  const oldL = bMap.querySelector('.blabels');
  if (oldL) oldL.remove();
  bHover = null;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `<pattern id="hatchB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e9eaeb"></rect><line x1="0" y1="0" x2="0" y2="7" stroke="#d3d6d8" stroke-width="1.4"></line></pattern>`;
  svg.appendChild(defs);
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(g);
  const layer = document.createElement('div');
  layer.className = 'blabels';
  bMap.appendChild(svg);
  bMap.appendChild(layer);

  const rects = [], labels = [];
  const rootRect = { x: 0, y: 0, w: W, h: H };
  B.scheme.root._rect = rootRect;

  function rect(n, r, kind) {
    const t = tone(n);
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    el.setAttribute('x', r.x); el.setAttribute('y', r.y);
    el.setAttribute('width', Math.max(0, r.w)); el.setAttribute('height', Math.max(0, r.h));
    el.setAttribute('class', 'tile-svg' + (kind === 'leaf' ? ' leaf' : ''));
    el.setAttribute('vector-effect', 'non-scaling-stroke');
    el.setAttribute('data-id', n.id);
    el.setAttribute('data-d', isDark(t) ? '1' : '0');
    el.setAttribute('fill', n._ph ? 'url(#hatchB)' : toneCss(t));
    if (n._ph) el.setAttribute('fill-opacity', '1');
    g.appendChild(el);
    rects.push({ el, _node: n });
    return el;
  }

  const rs = squarify(B.scheme.root._kids, rootRect);
  B.scheme.root._kids.forEach((grp, i) => {
    if (!rs[i]) return;
    const gr = inset(rs[i], 1);
    grp._rect = gr;
    if (gr.w < 0.5 || gr.h < 0.5) return;
    rect(grp, gr, 'group');
    labels.push({ n: grp, r: gr, cap: true });
    if (!grp._kids.length) return;
    const body = inset(gr, 1);
    if (body.w < 1 || body.h < 1) return;
    const cr = squarify(grp._kids, body);
    grp._kids.forEach((c, j) => {
      if (!cr[j]) return;
      const q = inset(cr[j], 0.5);
      c._rect = q;
      if (q.w < 0.5 || q.h < 0.5) return;
      rect(c, q, 'leaf');
      labels.push({ n: c, r: q, cap: false });
    });
  });

  bBuilt = { svg, g, layer, rects, labels };
  applyCam();
  bLabel();
  bCrumb();
}

function bScheme(id) {
  B.scheme = B.data.schemes.find(s => s.id === id) || B.data.schemes[0];
  B.byId = B.scheme.root._byId;
  B.focus = B.scheme.root;
  markSwitch(B.scheme.id);
  setMetrics(B.scheme);
  bBuild();
  cam.k = 1; cam.x = 0; cam.y = 0;
  applyCam();
}

/* —— 交互 —— */
bMap.addEventListener('wheel', e => {
  e.preventDefault();
  bStopAnim();
  const rect = bMap.getBoundingClientRect();
  bZoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

bMap.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const rect = bMap.getBoundingClientRect();
  bDragging = true;
  bMoved = 0;
  bDown = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, id: e.pointerId };
  bMap.setPointerCapture(e.pointerId);
});

bMap.addEventListener('pointermove', e => {
  if (!bDragging || !bDown) {
    const el = e.target.closest && e.target.closest('rect[data-id]');
    if (el) {
      const n = B.byId[el.dataset.id];
      if (n) showTip(n, e.clientX, e.clientY);
      if (bHover !== el) {
        if (bHover) bHover.classList.remove('hov');
        bHover = el;
        el.classList.add('hov');
      }
    } else if (bHover) {
      bHover.classList.remove('hov');
      bHover = null;
      hideTip();
    }
    return;
  }
  const dx = e.clientX - bDown.x, dy = e.clientY - bDown.y;
  bMoved = Math.max(bMoved, Math.abs(dx) + Math.abs(dy));
  const W = bW(), H = bH();
  cam.x = clamp(bDown.cx + dx, W - W * cam.k, 0);
  cam.y = clamp(bDown.cy + dy, H - H * cam.k, 0);
  applyCam();
  bScheduleLabel();
  hideTip();
});

bMap.addEventListener('pointerup', e => {
  if (!bDragging) return;
  bDragging = false;
  try { bMap.releasePointerCapture(e.pointerId); } catch (_) { }
  if (bMoved > 4 || !bDown) { bDown = null; return; }
  bDown = null;
  const el = e.target.closest && e.target.closest('rect[data-id]');
  if (!el) return;
  let n = B.byId[el.dataset.id];
  while (n && !(n._kids && n._kids.length)) n = n._p;
  if (!n) return;
  if (n === B.focus && Math.abs(cam.k - 1) > 0.01) return;
  bGo(n);
});

bMap.addEventListener('pointerleave', () => {
  if (bHover) bHover.classList.remove('hov');
  bHover = null;
  hideTip();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const f = B.focus;
    if (f && f !== B.scheme.root) bGo(f._p || B.scheme.root);
  }
});

document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => bScheme(b.dataset.s)));

let bResizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(bResizeT);
  bResizeT = setTimeout(() => {
    const f = B.focus || B.scheme.root;
    bBuild();
    bGo(f, true);
  }, 140);
});

(async function () {
  try {
    B.data = await loadTaxonomy();
    B.data.schemes.forEach(s => prep(s.root));
    bScheme('scheme-b');
  } catch (err) {
    bMap.innerHTML = `<div class="err">数据加载失败：${esc(err.message)}<br>请通过本地 http 服务打开本页。</div>`;
  }
})();

</script>
</body>
</html>
